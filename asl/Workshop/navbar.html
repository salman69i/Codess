<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            max-width: 1200px;
            margin: auto;

        }

        .main {
            display: flex;
            align-content: center;
            justify-content: space-between;
            margin-top: 5px;
            background-color: rgb(3, 5, 7);
            border-radius: 5px;
        }

        .button {
            color: whitesmoke;
            background-color: rgb(1, 3, 17);
            margin: 20px;
            padding-left: 12px;
            padding-right: 12px;
            padding-top: 12px;
            padding-bottom: 12px;
            border: none;
            border-radius: 12px;
        }

        .main>nav>ul>a {
            list-style: none;
            color: whitesmoke;
        }

        .main>nav>ul {
            display: flex;
            gap: 24px;
            font: message-box;
        }
    </style>
</head>

<body>
    <header>
        <div class="main">
            <div>
                <img src="./Screenshot 2026-09-10 011841.png" alt="This is our company logo">
            </div>
            <nav>
                <ul>
                    <a href="#">Home</a>
                    <a href="#">Company</a>
                    <a href="#">Analytics</a>
                    <a href="#">Products</a>
                    <a href="#">Users</a>
                    <a href="#">Contacts</a>
                </ul>
            </nav>
            <div>
                <button class="button">
                    Log in / Sign up
                </button>
            </div>
        </div>
    </header>
</body>

</html>
